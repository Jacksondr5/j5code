name: J5 CLI Resource Monitors

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source commit to build
        type: string
        required: true
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            binary: t3-resource-monitor
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            binary: t3-resource-monitor
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            binary: t3-resource-monitor
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: win32-x64
            binary: t3-resource-monitor.exe
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: native/resource-monitor

      - uses: actions/cache@v6
        id: cache
        with:
          path: native/resource-monitor/target/${{ matrix.target }}/release/${{ matrix.binary }}
          key: j5-monitor-${{ matrix.target }}-${{ hashFiles('native/resource-monitor/Cargo.lock', 'native/resource-monitor/Cargo.toml', 'native/resource-monitor/src/**') }}

      - name: Install Rust
        if: steps.cache.outputs.cache-hit != 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --target ${{ matrix.target }}

      - name: Build resource monitor
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo +1.95.0 build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: j5-resource-monitor-${{ matrix.platform }}
          path: native/resource-monitor/target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 30
