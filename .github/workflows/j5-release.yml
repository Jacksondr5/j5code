name: J5 Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful J5 Signed macOS Build run to publish
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: j5-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/github-script@v8
        id: source
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        with:
          script: |
            if (!/^\d+$/.test(process.env.BUILD_RUN_ID)) throw new Error('A numeric build run ID is required.');
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo, run_id: Number(process.env.BUILD_RUN_ID),
            });
            if (run.conclusion !== 'success' || run.path !== '.github/workflows/j5-macos-build.yml') {
              throw new Error('Select a successful J5 Signed macOS Build run.');
            }
            const versions = await Promise.all(['apps/server/package.json', 'apps/desktop/package.json'].map(async path => {
              const { data } = await github.rest.repos.getContent({ ...context.repo, path, ref: run.head_sha });
              return JSON.parse(Buffer.from(data.content, 'base64').toString()).version;
            }));
            if (!/^\d+\.\d+\.\d+$/.test(versions[0]) || versions[0] !== versions[1]) {
              throw new Error('This workflow requires matching stable desktop and CLI versions.');
            }
            core.setOutput('ref', run.head_sha);
            core.setOutput('version', versions[0]);
            core.notice(`Publishing J5 Code ${versions[0]} from ${run.head_sha}.`);

  monitors:
    needs: resolve
    uses: ./.github/workflows/j5-resource-monitors.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  publish_cli:
    needs: [resolve, monitors]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check whether this exact source is already published
        id: existing
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`https://registry.npmjs.org/@jacksondr5%2Fj5code/${process.env.RELEASE_VERSION}`);
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
          } else {
            if (!response.ok) throw new Error(`npm returned ${response.status}`);
            const pkg = await response.json();
            if (pkg.gitHead !== process.env.RELEASE_SHA) throw new Error('This version is already published from different or unknown source.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          JS

      - name: Test server update and SSH package behavior
        if: steps.existing.outputs.published != 'true'
        run: >-
          pnpm exec vp test run
          apps/server/src/cloud/pinnedRuntime.test.ts
          apps/server/src/cloud/selfUpdate.test.ts
          apps/server/src/serviceLauncher.test.ts
          packages/ssh/src/command.test.ts
          packages/ssh/src/tunnel.test.ts

      - name: Build CLI and web client
        if: steps.existing.outputs.published != 'true'
        run: pnpm exec vp run --filter t3 build

      - uses: actions/download-artifact@v8
        if: steps.existing.outputs.published != 'true'
        with:
          pattern: j5-resource-monitor-*
          path: resource-monitors

      - name: Bundle native resource monitors
        if: steps.existing.outputs.published != 'true'
        run: |
          set -euo pipefail
          for artifact_dir in resource-monitors/j5-resource-monitor-*; do
            platform="${artifact_dir##*/j5-resource-monitor-}"
            target_dir="apps/server/dist/resource-monitor/$platform"
            mkdir -p "$target_dir"
            cp "$artifact_dir"/t3-resource-monitor* "$target_dir/"
            if [[ -f "$target_dir/t3-resource-monitor" ]]; then
              chmod +x "$target_dir/t3-resource-monitor"
            fi
          done

      - name: Publish through npm trusted publishing
        if: steps.existing.outputs.published != 'true'
        run: pnpm exec node apps/server/scripts/cli.ts publish --app-version "$RELEASE_VERSION" --provenance --verbose

      - name: Confirm npm version is available before desktop publication
        run: test "$(npm view "@jacksondr5/j5code@$RELEASE_VERSION" version --prefer-online)" = "$RELEASE_VERSION"

  release:
    needs: [resolve, publish_cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_SHA: ${{ needs.resolve.outputs.ref }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: j5-code-signed-macos-arm64
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
          path: release-assets

      - name: Publish verified desktop assets
        run: |
          set -euo pipefail
          test -f "release-assets/J5-Code-$RELEASE_VERSION-arm64.dmg"
          test -f "release-assets/J5-Code-$RELEASE_VERSION-arm64.zip"
          grep -Fx "version: $RELEASE_VERSION" release-assets/latest-mac.yml
          tag="v$RELEASE_VERSION"
          if tag_sha="$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha 2>/dev/null)"; then
            test "$tag_sha" = "$RELEASE_SHA"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          J5 Code $RELEASE_VERSION

          - macOS Apple Silicon app, Developer ID signed and notarized by Apple.
          - CLI and web client: \`npx @jacksondr5/j5code@$RELEASE_VERSION\`.
          - ZIP, blockmaps, and update metadata support desktop updates.

          Built from $RELEASE_SHA.
          EOF
            gh release create "$tag" --target "$RELEASE_SHA" --title "J5 Code $RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --draft
          fi
          gh release upload "$tag" release-assets/* --clobber
          gh release edit "$tag" --draft=false --latest
