name: J5 Verify Apple Credentials

on:
  push:
    branches: [verify/apple-signing-20260912]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Developer ID signing and notarization access
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check Apple credentials
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name."
              exit 1
            fi
          done

          umask 077
          credential_dir="$(mktemp -d "$RUNNER_TEMP/j5-apple-check.XXXXXX")"
          keychain_path="$credential_dir/signing.keychain-db"
          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -rf "$credential_dir"
          }
          trap cleanup EXIT

          if ! printf '%s' "$CSC_LINK" | base64 -D > "$credential_dir/certificate.p12" 2>/dev/null; then
            echo "::error::CSC_LINK is not a valid base64-encoded P12."
            exit 1
          fi
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" "$HOME/Library/Keychains/login.keychain-db"
          if ! security import "$credential_dir/certificate.p12" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign > "$credential_dir/import.log" 2>&1; then
            sed -n 's/^security: /Certificate import: /p' "$credential_dir/import.log"
            if openssl pkcs12 -in "$credential_dir/certificate.p12" -passin env:CSC_KEY_PASSWORD -noout > "$credential_dir/p12-check.log" 2>&1; then
              echo "P12 password is valid; converting to a macOS-compatible PKCS12 format."
              openssl pkcs12 -in "$credential_dir/certificate.p12" -passin env:CSC_KEY_PASSWORD -nodes -out "$credential_dir/signing.pem" > "$credential_dir/convert.log" 2>&1
              openssl pkcs12 -export -in "$credential_dir/signing.pem" -out "$credential_dir/compatible.p12" -passout env:CSC_KEY_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 >> "$credential_dir/convert.log" 2>&1
              rm -f "$credential_dir/signing.pem"
              if ! security import "$credential_dir/compatible.p12" -k "$keychain_path" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign > "$credential_dir/import-compatible.log" 2>&1; then
                sed -n 's/^security: /Certificate import: /p' "$credential_dir/import-compatible.log"
                echo "::error::macOS could not import the compatible P12."
                exit 1
              fi
              echo '- P12 requires a compatibility conversion before macOS Keychain import.' >> "$GITHUB_STEP_SUMMARY"
            else
              if grep -Eiq 'mac verify|mac verification|invalid password' "$credential_dir/p12-check.log"; then
                echo "::error::The P12 password check failed. CSC_KEY_PASSWORD does not match CSC_LINK, or the P12 is damaged."
              else
                echo "::error::The certificate is not a readable P12 with the supplied password. Check the export format and CSC_KEY_PASSWORD."
              fi
              exit 1
            fi
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path" >/dev/null 2>&1
          security find-identity -v -p codesigning "$keychain_path" > "$credential_dir/identities.txt"
          signing_identity="$(python3 - "$credential_dir/identities.txt" <<'PY'
          import os, re, sys
          identities = open(sys.argv[1]).read()
          team = re.escape(os.environ['APPLE_TEAM_ID'])
          match = re.search(r'([A-F0-9]{40}) "Developer ID Application: [^"\n]+ \(' + team + r'\)"', identities)
          if not match:
              sys.exit('::error::No valid Developer ID Application identity for APPLE_TEAM_ID. Check certificate type, team, expiry, and included private key.')
          print(match.group(1))
          PY
          )"
          echo "Developer ID Application certificate and private key imported for the configured team."

          printf 'int main(void) { return 0; }\n' > "$credential_dir/probe.c"
          clang "$credential_dir/probe.c" -o "$credential_dir/probe"
          if ! codesign --force --timestamp --options runtime --keychain "$keychain_path" --sign "$signing_identity" --identifier codes.jackson.j5code.signing-check "$credential_dir/probe" > "$credential_dir/sign.log" 2>&1; then
            cat "$credential_dir/sign.log"
            echo "::error::Developer ID signing or Apple timestamping failed."
            exit 1
          fi
          codesign --verify --strict "$credential_dir/probe"
          echo "Developer ID signing, timestamping, and signature verification passed."

          {
            echo '### Developer ID signing verified'
            echo '- Certificate matches the configured Apple team.'
            echo '- P12 password and private key work.'
            echo '- Signing, Apple timestamping, and signature verification passed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check notarization API credentials independently
        if: ${{ !cancelled() }}
        shell: bash
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          umask 077
          credential_dir="$(mktemp -d "$RUNNER_TEMP/j5-notary-check.XXXXXX")"
          trap 'rm -rf "$credential_dir"' EXIT
          key_path="$credential_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          if ! openssl pkey -in "$key_path" -noout > /dev/null 2>&1; then
            echo "::error::APPLE_API_KEY must contain the PEM contents of the downloaded P8 file."
            exit 1
          fi
          if ! xcrun notarytool history --key "$key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json > "$credential_dir/notary-history.json" 2> "$credential_dir/notary-error.log"; then
            echo "::error::Notarization API authentication failed. Check the team API key, Key ID, Issuer ID, and account access."
            exit 1
          fi
          echo "Notarization API authentication passed."
          {
            echo '### Notarization API verified'
            echo '- App Store Connect API key authenticated to the notarization service.'
            echo '- No release was published or application submitted for notarization.'
          } >> "$GITHUB_STEP_SUMMARY"
